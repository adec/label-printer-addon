# Home Assistant add-on: Label Printer
#
# A generic label print service: it accepts a finished PNG/PDF — or raw printer
# language such as ZPL — over HTTP and prints it on a USB label printer via
# CUPS. It renders nothing itself, so anything that can produce a label can use
# it: the Fridge Assistant integration, Label Assistant, or an external webshop.
#
# Philosophy: plugged in + recognized = available. There are no per-printer
# on/off switches; every supported printer found on USB gets its own CUPS
# queue. The ONLY thing to configure is which label roll is loaded per
# printer — that mirrors the physical roll, so it lives here (and only here).
name: "Label Printer"
version: "0.14.1"
slug: "label_printer"
description: >-
  Print PNG/PDF labels on Brother QL-1110NWB over the network and USB label printers. Auto-detects DYMO
  LabelWriter and Zebra printers side by side, exposes an HTTP API, and lets
  you pick the loaded label roll by DYMO part number or Zebra size.
url: "https://github.com/adec/label-printer-addon"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: manual
init: false
usb: true
full_access: true
# NOT "devices: [/dev/bus/usb]": that static mapping makes Supervisor's
# hardware monitor restart this whole add-on on every USB add/remove event
# for that path. "usb: true" already grants the same access dynamically,
# without the restart-on-hotplug behavior — see CHANGELOG 0.11.0. A printer
# that browns out and flaps its USB connection (e.g. after a power outage)
# must not crash-loop the add-on over it.
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "HTTP print API (GET /printers, POST /print with PNG/PDF/ZPL)"
# The dashboard goes through ingress, not through a "webui" link to
# http://[HOST]:8000. That link only ever resolves on the LAN, so it hangs for
# anyone on Nabu Casa remote, on mobile data, or on a device that cannot do
# mDNS. Ingress rides Home Assistant's own connection and auth instead, so the
# same button works everywhere and the page can live in the sidebar.
# The published port stays open regardless: that is the print API that Fridge
# Assistant, Label Assistant and external callers use, and it needs no auth.
ingress: true
ingress_port: 8000
panel_icon: "mdi:printer"
panel_title: "Label Printer"
map:
  - share:rw
options:
  brother_host: ""
  brother_port: 9100
  brother_label: "62"
  brother_length_mm: 100
  brother_cut: true
  brother_size_mismatch: "scale"
  brother_crop_align: "center"
  dymo_label: "99014 (54 x 101 mm)"
  dymo_custom_media: "54x101"
  dymo_size_mismatch: "scale"
  dymo_crop_align: "center"
  zebra_label: "104x159 mm (PostNL / S0904980)"
  zebra_custom_size: "100x150"
  zebra_size_mismatch: "scale"
  zebra_crop_align: "center"
  printer_model: "auto"
  log_level: "info"
schema:
  brother_host: "str?"
  brother_port: "port"
  brother_label: "list(12|29|38|50|54|62|102|103|17x54|17x87|29x42|29x90|39x90|39x48|60x86|62x100|102x51|102x152|103x164)"
  brother_length_mm: "int(26,3000)"
  brother_cut: "bool"
  brother_size_mismatch: "list(scale|crop|reject)"
  brother_crop_align: "list(center|leading-edge)"
  dymo_label: "list(auto|99010 (28 x 89 mm)|99012 (36 x 89 mm)|99014 (54 x 101 mm)|99015 (54 x 70 mm)|11352 (25 x 54 mm)|11354 (57 x 32 mm)|99019 (59 x 102 mm)|904980 (104 x 159 mm)|custom)"
  dymo_custom_media: "str?"
  dymo_size_mismatch: "list(scale|crop|reject)"
  dymo_crop_align: "list(center|leading-edge)"
  zebra_label: "list(104x159 mm (PostNL / S0904980)|102x152 mm (4x6 inch)|102x102 mm|100x50 mm|76x51 mm|57x32 mm|50x25 mm|custom)"
  zebra_custom_size: "str?"
  zebra_size_mismatch: "list(scale|crop|reject)"
  zebra_crop_align: "list(center|leading-edge)"
  printer_model: "list(auto|lw550|lw550t|lw5xl|lw450|lw450t|lw450tt|lw400|lw330)"
  log_level: "list(debug|info|warning|error)"
