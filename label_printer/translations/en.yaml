configuration:
  brother_host:
    name: "Brother — IP address or hostname"
    description: "QL-1110NWB on Wi-Fi/Ethernet. Leave empty to disable."
  brother_port:
    name: "Brother — TCP port"
    description: "Raw raster TCP port, normally 9100."
  brother_label:
    name: "Brother — loaded DK roll"
    description: "Select auto to detect the loaded roll using TCP status or the English HTTP status page. For manual selection, use width for continuous rolls or width x length for die-cut labels."
  brother_length_mm:
    name: "Brother — continuous label length (mm)"
    description: "26–3000 mm, used only for continuous rolls, including when automatic roll detection is enabled."
  brother_cut:
    name: "Brother — automatic cutting"
    description: "Cut labels after printing."
  brother_size_mismatch:
    name: "Brother — image size handling"
    description: "Scale to fit, crop/pad at one dot per pixel, or reject mismatched dimensions."
  brother_crop_align:
    name: "Brother — alignment"
    description: "Center, or align at the leading edge of the label."
  dymo_label:
    name: "DYMO — label loaded"
    description: >-
      Which roll is in your DYMO LabelWriter right now, by DYMO part number
      (it's printed on the label box). Bought new labels? Swap the roll,
      pick them here, restart the add-on — done. On a LabelWriter 550, 550
      Turbo or 5XL, set this to "auto": it reads the roll off its NFC tag and
      follows a swap on its own, no restart. "custom" uses the size below.
  dymo_custom_media:
    name: "DYMO — custom label size"
    description: >-
      Only used when the DYMO label is set to "custom": width x height in mm
      (e.g. 54x101) or a CUPS media name (e.g. w154h286).
  dymo_size_mismatch:
    name: "DYMO — when the image size doesn't match"
    description: >-
      What happens when a PNG/PDF/JPG isn't exactly the loaded label size.
      "scale" fits it onto the label (aspect kept, never cropped). "crop"
      prints 1:1 — one image pixel is one printer dot, overhang falls off —
      for art where the size must never change (barcodes). "reject" refuses
      the job with an error so the sender notices. Raw ZPL is never affected.
  dymo_crop_align:
    name: "DYMO — crop alignment"
    description: >-
      Only used with "crop": where the art sits on the label. "center" crops
      or pads evenly on all sides; "leading-edge" pins it to the corner where
      printing starts, so overhang falls off at the far end only.
  zebra_label:
    name: "Zebra — label loaded"
    description: >-
      Which labels are in your Zebra, by size. 104x159 mm is the common
      shipping label (PostNL, DYMO S0904980 rolls fit too). After changing
      labels: restart the add-on and hold the printer's feed button until it
      flashes once to recalibrate the gap sensor.
  zebra_custom_size:
    name: "Zebra — custom label size"
    description: >-
      Only used when the Zebra label is set to "custom": width x height in mm,
      e.g. 100x150.
  zebra_size_mismatch:
    name: "Zebra — when the image size doesn't match"
    description: >-
      What happens when a PNG/PDF/JPG isn't exactly the loaded label size.
      "scale" fits it onto the label (aspect kept, never cropped). "crop"
      prints 1:1 — one image pixel is one printer dot, overhang falls off —
      for art where the size must never change (barcodes). "reject" refuses
      the job with an error so the sender notices. Raw ZPL is never affected.
  zebra_crop_align:
    name: "Zebra — crop alignment"
    description: >-
      Only used with "crop": where the art sits on the label. "center" crops
      or pads evenly on all sides; "leading-edge" pins it to the corner where
      printing starts, so overhang falls off at the far end only.
  printer_model:
    name: "DYMO model (advanced)"
    description: >-
      Leave on "auto" — the model is detected from USB. Only force a model
      here if detection picks the wrong driver.
  log_level:
    name: "Log level"
    description: "How chatty the add-on log is. \"info\" is fine for daily use."
network:
  8000/tcp: "HTTP print API (GET /printers, POST /print with PNG/PDF/ZPL)"
